<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hermes Chat</title>
  <style>
    :root {
      --bg: var(--vscode-editor-background, #1e1e1e);
      --fg: var(--vscode-editor-foreground, #d4d4d4);
      --border: var(--vscode-panel-border, #333);
      --input-bg: var(--vscode-input-background, #2d2d2d);
      --input-fg: var(--vscode-input-foreground, #ccc);
      --accent: #ffbf00;
      --accent-dim: #b8860b;
      --user-bubble: var(--vscode-button-background, #0e639c);
      --assistant-bubble: #1e2a3a;
      --tool-bg: #1a2332;
      --thinking-bg: #1a1a2e;
      --error: #ef5350;
      --success: #4caf50;
      --muted: #888;
      --radius: 8px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--vscode-editor-font-family, 'SF Mono', Monaco, Menlo, monospace);
      font-size: 13px; background: var(--bg); color: var(--fg);
      height: 100vh; display: flex; flex-direction: column; overflow: hidden;
    }
    #context-bar {
      padding: 6px 12px; background: #252525; border-bottom: 1px solid var(--border);
      font-size: 11px; color: var(--muted); display: flex; align-items: center;
      gap: 10px; min-height: 28px; flex-shrink: 0;
    }
    #context-bar .badge {
      background: var(--accent-dim); color: var(--bg); padding: 1px 6px;
      border-radius: 3px; font-size: 10px; font-weight: 600;
    }
    #context-bar .path { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #messages {
      flex: 1; overflow-y: auto; padding: 16px; display: flex;
      flex-direction: column; gap: 10px;
    }
    #messages::-webkit-scrollbar { width: 6px; }
    #messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    .msg {
      max-width: 85%; padding: 10px 14px; border-radius: var(--radius);
      line-height: 1.5; white-space: pre-wrap; word-break: break-word;
    }
    .msg.user { align-self: flex-end; background: var(--user-bubble); border-bottom-right-radius: 4px; }
    .msg.assistant {
      align-self: flex-start; background: var(--assistant-bubble);
      border: 1px solid var(--border); border-bottom-left-radius: 4px;
    }
    .msg .role {
      font-size: 10px; text-transform: uppercase; letter-spacing: 1px;
      margin-bottom: 4px; color: var(--muted);
    }
    .thinking {
      background: var(--thinking-bg); border: 1px dashed var(--border);
      border-radius: var(--radius); padding: 8px 14px; margin: 2px 0;
      align-self: flex-start; max-width: 85%;
    }
    .thinking .header { font-size: 11px; color: var(--accent-dim); cursor: pointer; user-select: none; }
    .thinking .content { display: none; margin-top: 6px; font-size: 12px; color: var(--muted); white-space: pre-wrap; }
    .thinking.open .content { display: block; }
    .tool-call {
      background: var(--tool-bg); border: 1px solid var(--border);
      border-left: 3px solid var(--accent-dim); border-radius: var(--radius);
      padding: 8px 12px; margin: 2px 0; align-self: flex-start;
      max-width: 90%; font-size: 12px;
    }
    .tool-call .tool-name { color: var(--accent); font-weight: 600; }
    .tool-call .tool-detail { color: var(--muted); font-size: 11px; margin-top: 4px; display: none; white-space: pre-wrap; }
    .tool-call.expanded .tool-detail { display: block; }
    .status-line { align-self: center; font-size: 11px; color: var(--muted); font-style: italic; }
    #input-area {
      padding: 10px 12px; border-top: 1px solid var(--border); background: var(--bg);
      display: flex; gap: 8px; flex-shrink: 0; align-items: flex-end;
    }
    #input-area textarea {
      flex: 1; background: var(--input-bg); color: var(--input-fg);
      border: 1px solid var(--border); border-radius: var(--radius);
      padding: 10px 12px; font-family: inherit; font-size: 13px;
      resize: none; min-height: 36px; max-height: 200px; line-height: 1.4;
    }
    #input-area textarea:focus { outline: none; border-color: var(--accent-dim); }
    #input-area button {
      background: var(--accent-dim); color: var(--bg); border: none;
      border-radius: var(--radius); padding: 8px 16px; cursor: pointer;
      font-size: 13px; font-weight: 600; white-space: nowrap;
    }
    #input-area button:hover { background: var(--accent); }
    #input-area button:disabled { opacity: 0.4; cursor: default; }
    #connecting {
      position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
      text-align: center; color: var(--muted);
    }
    .spinner {
      width: 30px; height: 30px; border: 3px solid var(--border);
      border-top-color: var(--accent); border-radius: 50%;
      animation: spin 0.8s linear infinite; margin: 0 auto 12px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .file-link { color: var(--accent-dim); text-decoration: underline; cursor: pointer; }
    .file-link:hover { color: var(--accent); }
    .error-msg { color: var(--error); padding: 8px 14px; border-radius: var(--radius); background: rgba(239,83,80,0.1); align-self: flex-start; }
    .mode-selector {
      display: flex; gap: 2px; background: var(--border); border-radius: 4px; padding: 1px;
    }
    .mode-selector button {
      background: transparent; color: var(--muted); border: none;
      padding: 2px 8px; font-size: 10px; cursor: pointer; border-radius: 3px;
    }
    .mode-selector button.active { background: var(--accent-dim); color: var(--bg); font-weight: 600; }
  </style>
</head>
<body>
  <div id="connecting">
    <div class="spinner"></div>
    <div id="connecting-text">Connecting to Hermes...</div>
  </div>

  <div id="context-bar" style="display:none">
    <span class="badge" id="mode-badge">bypass</span>
    <span id="ctx-file" class="path"></span>
  </div>

  <div id="messages"></div>

  <div id="input-area" style="display:none">
    <textarea id="user-input" rows="1" placeholder="Message Hermes... (or /command)"></textarea>
    <button id="send-btn" onclick="sendMessage()">Send</button>
  </div>

  <script>
    const vscode = acquireVsCodeApi();
    let ws = null;
    let currentSessionId = null;
    let rpcId = 0;
    let pendingRpc = {};
    let isStreaming = false;
    let assistantEl = null;
    let thinkingEl = null;
    let thinkingText = '';
    let assistantText = '';
    let currentFile = null;
    let currentCwd = '';
    let mode = 'bypass';

    // ── Boot ──
    vscode.postMessage({ type: 'ensureServer' });

    window.addEventListener('message', (event) => {
      const msg = event.data;
      switch (msg.type) {
        case 'serverReady': connectWS(msg.wsUrl); break;
        case 'serverError': showConnecting(false, msg.error); break;
        case 'contextUpdate': updateContext(msg.file, msg.cwd); break;
        case 'sessionContext': currentCwd = msg.cwd || currentCwd; currentFile = msg.file; break;
        case 'newSession': startNewSession(); break;
        case 'resumeSessionAck': resumeSession(msg.sessionId); break;
        case 'sendMessageAck': doSend(msg.text, msg.sessionId || currentSessionId); break;
        case 'interruptAck': doInterrupt(msg.sessionId); break;
        case 'slashCommandAck': doSlash(msg.command, msg.sessionId); break;
        case 'sessionList': renderSessionList(msg.sessions); break;
        case 'profileList': renderProfiles(msg.profiles); break;
      }
    });

    // ── WebSocket ──
    function connectWS(url) {
      ws = new WebSocket(url);
      ws.onopen = () => {
        console.log('WS connected');
      };
      ws.onmessage = (event) => {
        const data = JSON.parse(event.data);
        handleWsMessage(data);
      };
      ws.onerror = (err) => {
        console.error('WS error', err);
        showConnecting(false, 'WebSocket connection failed');
      };
      ws.onclose = () => {
        console.log('WS closed');
        // Try reconnect after delay
        setTimeout(() => { if (!ws || ws.readyState === WebSocket.CLOSED) connectWS(url); }, 3000);
      };
    }

    function sendRpc(method, params) {
      const id = ++rpcId;
      const msg = { jsonrpc: '2.0', id, method, params };
      ws.send(JSON.stringify(msg));
      return id;
    }

    function handleWsMessage(data) {
      // Event from gateway
      if (data.method === 'event') {
        const p = data.params || {};
        const t = p.type;
        if (!t) return;

        switch (t) {
          case 'gateway.ready':
            showChat();
            break;
          case 'session.info':
            updateSessionInfo(p);
            break;
          case 'session.title':
            updateTitle(p);
            break;
          case 'message.start':
            startAssistant();
            break;
          case 'thinking.delta':
            appendThinking(p.payload?.text || p.text || '');
            break;
          case 'reasoning.available':
            setReasoning(p.payload?.text || p.text || '');
            break;
          case 'message.delta':
          case 'message.complete':
            appendAssistant(p.payload?.text || p.text || '');
            break;
          case 'tool.start':
          case 'tool.call':
            addToolCall(p.payload || p);
            break;
          case 'tool.delta':
            updateToolCall(p.payload || p);
            break;
          case 'tool.end':
          case 'tool.result':
            finishToolCall(p.payload || p);
            break;
          case 'status.update':
            addStatus(p.payload?.text || p.text || '');
            break;
          case 'turn.end':
            finishTurn();
            break;
          case 'sessions.changed':
            // Refresh session list
            vscode.postMessage({ type: 'getSessions' });
            break;
          case 'session.usage':
            updateUsage(p.payload || p);
            break;
          case 'error':
            addError(p.payload?.message || p.message || 'Unknown error');
            break;
        }
        return;
      }
      // RPC response
      if (data.id && pendingRpc[data.id]) {
        const cb = pendingRpc[data.id];
        delete pendingRpc[data.id];
        cb(data.result, data.error);
      } else if (data.id && data.result) {
        // Unsolicited result — could be session.create
        if (data.result.session_id) {
          currentSessionId = data.result.session_id;
        }
      }
    }

    // ── UI Helpers ──
    function showConnecting(show, error) {
      const el = document.getElementById('connecting');
      if (show) { el.style.display = 'block'; }
      else if (error) {
        el.innerHTML = '<div style="color:var(--error)">' + error + '</div>';
        el.style.display = 'block';
      } else { el.style.display = 'none'; }
    }

    function showChat() {
      showConnecting(false);
      document.getElementById('context-bar').style.display = 'flex';
      document.getElementById('input-area').style.display = 'flex';
      document.getElementById('user-input').focus();
      // Request session context
      vscode.postMessage({ type: 'createSession', cwd: currentCwd });
    }

    function updateContext(file, cwd) {
      currentFile = file;
      currentCwd = cwd || currentCwd;
      const el = document.getElementById('ctx-file');
      if (file) {
        const name = file.split('/').pop();
        el.textContent = '📄 ' + name;
        el.title = file;
      } else {
        el.textContent = cwd ? '📁 ' + cwd.split('/').pop() : '';
      }
    }

    function requestServer() {
      vscode.postMessage({ type: 'ensureServer' });
    }

    // ── Session management ──
    function startNewSession() {
      currentSessionId = null;
      document.getElementById('messages').innerHTML = '';
      // Create session via WS
      if (ws && ws.readyState === WebSocket.OPEN) {
        const id = sendRpc('session.create', { cols: 120, source: 'vscode', cwd: currentCwd });
        pendingRpc[id] = (result, error) => {
          if (result && result.session_id) {
            currentSessionId = result.session_id;
          }
        };
      }
    }

    function resumeSession(sid) {
      if (!ws || ws.readyState !== WebSocket.OPEN) return;
      const id = sendRpc('session.resume', { session_id: sid });
      pendingRpc[id] = (result, error) => {
        if (error) { addError(error.message); return; }
        currentSessionId = sid;
        document.getElementById('messages').innerHTML = '';
        // Render existing messages
        if (result && result.messages) {
          for (const m of result.messages) {
            renderHistoryMessage(m);
          }
        }
      };
    }

    function renderHistoryMessage(m) {
      if (m.role === 'user') {
        addUserMessage(m.text || m.content || '');
      } else if (m.role === 'assistant') {
        addAssistantMessage(m.text || m.content || '');
      }
    }

    function updateSessionInfo(p) {
      if (p.payload) {
        const info = p.payload;
        if (info.model) { /* could show in status bar */ }
      }
    }

    function updateTitle(p) {
      const payload = p.payload || {};
      if (payload.title) {
        document.title = 'Hermes: ' + payload.title;
      }
    }

    // ── Message rendering ──
    function addUserMessage(text) {
      const div = document.createElement('div');
      div.className = 'msg user';
      div.textContent = text;
      document.getElementById('messages').appendChild(div);
      scrollDown();
    }

    function startAssistant() {
      isStreaming = true;
      setButtons(true);
      assistantText = '';
      thinkingText = '';
      const div = document.createElement('div');
      div.className = 'msg assistant';
      div.innerHTML = '<div class="role">Assistant</div><span class="content"></span>';
      document.getElementById('messages').appendChild(div);
      assistantEl = div.querySelector('.content');
      // Add thinking section
      const t = document.createElement('div');
      t.className = 'thinking';
      t.innerHTML = '<div class="header" onclick="this.parentElement.classList.toggle(\'open\')">Thinking...</div><div class="content"></div>';
      t.style.display = 'none';
      document.getElementById('messages').appendChild(t);
      thinkingEl = t;
      scrollDown();
    }

    function appendThinking(text) {
      if (!text || !thinkingEl) return;
      thinkingEl.style.display = 'block';
      thinkingText += text;
      thinkingEl.querySelector('.content').textContent = thinkingText;
      scrollDown();
    }

    function setReasoning(text) {
      if (!text || !thinkingEl) return;
      thinkingEl.style.display = 'block';
      thinkingText = text;
      thinkingEl.querySelector('.content').textContent = text;
    }

    function appendAssistant(text) {
      if (!text || !assistantEl) return;
      assistantText += text;
      // Render markdown-lite: code blocks, bold, file links
      assistantEl.innerHTML = renderMarkdown(assistantText);
      scrollDown();
    }

    function addAssistantMessage(text) {
      const div = document.createElement('div');
      div.className = 'msg assistant';
      div.innerHTML = '<div class="role">Assistant</div><div>' + renderMarkdown(text) + '</div>';
      document.getElementById('messages').appendChild(div);
      scrollDown();
    }

    function addToolCall(p) {
      const div = document.createElement('div');
      div.className = 'tool-call';
      div.dataset.toolId = p.tool_id || p.id || '';
      const name = p.tool || p.name || 'tool';
      const args = p.args || p.arguments || '';
      div.innerHTML = '<span class="tool-name" onclick="this.parentElement.classList.toggle(\'expanded\')">' +
        name + '</span><div class="tool-detail">' + (typeof args === 'string' ? args : JSON.stringify(args, null, 2)) + '</div>';
      document.getElementById('messages').appendChild(div);
      scrollDown();
    }

    function updateToolCall(p) {
      const id = p.tool_id || p.id || '';
      const el = document.querySelector('.tool-call[data-tool-id="' + id + '"]');
      if (!el) return;
      const detail = el.querySelector('.tool-detail');
      if (detail && p.delta) detail.textContent += p.delta;
    }

    function finishToolCall(p) {
      const id = p.tool_id || p.id || '';
      const el = document.querySelector('.tool-call[data-tool-id="' + id + '"]');
      if (!el) return;
      el.style.borderLeftColor = p.error ? 'var(--error)' : 'var(--success)';
      const detail = el.querySelector('.tool-detail');
      if (detail && p.result) {
        detail.textContent += '\\n--- Result ---\\n' + (typeof p.result === 'string' ? p.result : JSON.stringify(p.result, null, 2));
      }
    }

    function addStatus(text) {
      if (!text) return;
      const div = document.createElement('div');
      div.className = 'status-line';
      div.textContent = text;
      document.getElementById('messages').appendChild(div);
      scrollDown();
    }

    function addError(text) {
      const div = document.createElement('div');
      div.className = 'error-msg';
      div.textContent = '⚠ ' + text;
      document.getElementById('messages').appendChild(div);
      scrollDown();
    }

    function finishTurn() {
      isStreaming = false;
      setButtons(false);
      if (thinkingEl && !thinkingText) thinkingEl.style.display = 'none';
      assistantEl = null;
      thinkingEl = null;
    }

    function updateUsage(p) {
      const u = p.usage || {};
      if (u.model) {
        // Could show in context bar
      }
    }

    // ── Send / interrupt ──
    function sendMessage() {
      const ta = document.getElementById('user-input');
      const text = ta.value.trim();
      if (!text) return;
      if (!ws || ws.readyState !== WebSocket.OPEN) {
        addError('Not connected to Hermes');
        return;
      }
      ta.value = '';
      ta.style.height = 'auto';
      // Show user message
      addUserMessage(text);
      // If no session, create one first
      if (!currentSessionId) {
        const id = sendRpc('session.create', { cols: 120, source: 'vscode', cwd: currentCwd });
        pendingRpc[id] = (result, error) => {
          if (result && result.session_id) {
            currentSessionId = result.session_id;
            doSend(text, currentSessionId);
          } else {
            addError('Failed to create session');
          }
        };
        return;
      }
      doSend(text, currentSessionId);
    }

    function doSend(text, sid) {
      vscode.postMessage({ type: 'sendMessage', text, sessionId: sid });
      // Actually send via WS now
      sendRpc('prompt.submit', { session_id: sid, text });
    }

    function doInterrupt(sid) {
      sendRpc('session.interrupt', { session_id: sid });
    }

    function doSlash(command, sid) {
      sendRpc('slash.exec', { session_id: sid, command });
    }

    // ── Input handling ──
    document.getElementById('user-input').addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    document.getElementById('user-input').addEventListener('input', (e) => {
      const ta = e.target;
      ta.style.height = 'auto';
      ta.style.height = Math.min(ta.scrollHeight, 200) + 'px';
    });

    function handleKeydown(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    }

    function setButtons(streaming) {
      const btn = document.getElementById('send-btn');
      if (streaming) {
        btn.textContent = 'Stop';
        btn.onclick = () => { doInterrupt(currentSessionId); };
      } else {
        btn.textContent = 'Send';
        btn.onclick = sendMessage;
      }
    }

    function scrollDown() {
      const el = document.getElementById('messages');
      el.scrollTop = el.scrollHeight;
    }

    // ── Markdown-lite ──
    function renderMarkdown(text) {
      if (!text) return '';
      let html = text
        // Escape HTML
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        // Code blocks
        .replace(/\\\`\\\`\\\`(\w*)\n?([\s\S]*?)\\\`\\\`\\\`/g, (m, lang, code) => {
          return '<pre style="background:#0d1117;padding:8px;border-radius:4px;overflow-x:auto;margin:4px 0;font-size:12px;"><code>' + code.trim() + '</code></pre>';
        })
        // Inline code
        .replace(/\\\`([^\`]+)\\\`/g, '<code style="background:#333;padding:1px 4px;border-radius:3px;font-size:12px;">$1</code>')
        // Bold
        .replace(/\\*\\*(.+?)\\*\\*/g, '<strong>$1</strong>')
        // File paths (clickable)
        .replace(/(^|\\s)(\\/[^\\s]+\\.[a-z]{2,})/g, (m, pre, path) => {
          return pre + '<span class="file-link" onclick="openFile(\\'' + path + '\\')">' + path + '</span>';
        })
        // Newlines
        .replace(/\\n/g, '<br>');
      return html;
    }

    function openFile(p) {
      vscode.postMessage({ type: 'openFile', path: p });
    }

    // ── Session list / profiles ──
    function renderSessionList(sessions) { /* handled by sidebar */ }
    function renderProfiles(profiles) { /* could populate a selector */ }
  </script>
</body>
</html>
