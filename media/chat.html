<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hermes Chat</title>
  <style>
    :root {
      --bg: var(--vscode-editor-background, #1e1e1e);
      --fg: var(--vscode-editor-foreground, #d4d4d4);
      --border: var(--vscode-panel-border, #333);
      --input-bg: var(--vscode-input-background, #2d2d2d);
      --input-fg: var(--vscode-input-foreground, #ccc);
      --accent: #ffbf00;
      --accent-dim: #b8860b;
      --user-bubble: var(--vscode-button-background, #0e639c);
      --assistant-bubble: #1e2a3a;
      --tool-bg: #1a2332;
      --thinking-bg: #1a1a2e;
      --error: #ef5350;
      --success: #4caf50;
      --muted: #888;
      --radius: 6px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      display: flex; flex-direction: column; height: 100vh;
      font-family: var(--vscode-editor-font-family, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif);
      font-size: 13px; color: var(--fg); background: var(--bg); overflow: hidden;
    }
    #messages {
      flex: 1; overflow-y: auto; padding: 12px; display: flex;
      flex-direction: column; gap: 8px;
    }
    .msg { max-width: 85%; padding: 8px 14px; border-radius: var(--radius); white-space: pre-wrap; word-break: break-word; line-height: 1.5; }
    .msg.user { background: var(--user-bubble); color: #fff; align-self: flex-end; }
    .msg.assistant { background: var(--assistant-bubble); align-self: flex-start; }
    .msg.assistant .role { font-size: 10px; color: var(--muted); margin-bottom: 4px; font-weight: 600; }
    .msg.assistant .content { }
    .thinking {
      align-self: flex-start; background: var(--thinking-bg); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 6px 10px; font-size: 11px; color: var(--muted); max-width: 80%;
    }
    .thinking .header { cursor: pointer; font-weight: 600; }
    .thinking .content { margin-top: 4px; display: none; white-space: pre-wrap; max-height: 200px; overflow-y: auto; }
    .thinking.open .content { display: block; }
    .tool-call {
      align-self: flex-start; background: var(--tool-bg); border-left: 3px solid var(--accent);
      padding: 6px 10px; border-radius: 4px; font-size: 12px; max-width: 80%;
    }
    .tool-call .tool-name { font-weight: 600; color: var(--accent-dim); cursor: pointer; }
    .tool-call .tool-detail { color: var(--muted); font-size: 11px; margin-top: 4px; display: none; white-space: pre-wrap; }
    .tool-call.expanded .tool-detail { display: block; }
    .status-line { align-self: center; font-size: 11px; color: var(--muted); font-style: italic; }
    #input-area {
      padding: 10px 12px; border-top: 1px solid var(--border); background: var(--bg);
      display: flex; gap: 8px; flex-shrink: 0; align-items: flex-end;
    }
    #input-area textarea {
      flex: 1; background: var(--input-bg); color: var(--input-fg);
      border: 1px solid var(--border); border-radius: var(--radius);
      padding: 10px 12px; font-family: inherit; font-size: 13px;
      resize: none; min-height: 36px; max-height: 200px; line-height: 1.4;
    }
    #input-area textarea:focus { outline: none; border-color: var(--accent-dim); }
    #input-area button {
      background: var(--accent-dim); color: var(--bg); border: none;
      border-radius: var(--radius); padding: 8px 16px; cursor: pointer;
      font-size: 13px; font-weight: 600; white-space: nowrap;
    }
    #input-area button:hover { background: var(--accent); }
    #input-area button:disabled { opacity: 0.4; cursor: default; }
    #connecting {
      position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
      text-align: center; color: var(--muted);
    }
    .spinner {
      width: 30px; height: 30px; border: 3px solid var(--border);
      border-top-color: var(--accent); border-radius: 50%;
      animation: spin 0.8s linear infinite; margin: 0 auto 12px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .file-link { color: var(--accent-dim); text-decoration: underline; cursor: pointer; }
    .file-link:hover { color: var(--accent); }
    .error-msg { color: var(--error); padding: 8px 14px; border-radius: var(--radius); background: rgba(239,83,80,0.1); align-self: flex-start; }
    .context-badge { font-size: 10px; padding: 1px 6px; border-radius: 3px; background: var(--border); color: var(--muted); margin-right: 6px; }
    #context-bar {
      padding: 4px 12px; font-size: 11px; color: var(--muted); border-bottom: 1px solid var(--border);
      display: flex; align-items: center; gap: 6px; flex-shrink: 0;
    }
  </style>
</head>
<body>
  <div id="connecting">
    <div class="spinner"></div>
    <div id="connecting-text">Connecting to Hermes...</div>
  </div>

  <div id="context-bar" style="display:none">
    <span id="ctx-file" class="path"></span>
  </div>

  <div id="messages"></div>

  <div id="input-area" style="display:none">
    <textarea id="user-input" rows="1" placeholder="Message Hermes... (or /command)"></textarea>
    <button id="send-btn" onclick="sendMessage()">Send</button>
  </div>

  <script>
    const vscode = acquireVsCodeApi();
    let currentSessionId = null;
    let isStreaming = false;
    let assistantEl = null;
    let thinkingEl = null;
    let thinkingText = '';
    let assistantText = '';
    let currentFile = null;
    let currentCwd = '';
    let rpcCounter = 0;

    // ── Boot ──
    vscode.postMessage({ type: 'ensureServer' });

    window.addEventListener('message', (event) => {
      const msg = event.data;
      switch (msg.type) {
        case 'serverReady': onServerReady(); break;
        case 'serverError': showConnecting(false, msg.error); break;
        case 'wsEvent': handleWsEvent(msg.data); break;
        case 'wsError': addError(msg.error); break;
        case 'wsClosed': console.log('[Hermes] WS closed by host'); break;
        case 'wsRpcResult': console.log('[Hermes] RPC result:', msg); break;
        case 'contextUpdate': updateContext(msg.file, msg.cwd); break;
        case 'sessionContext': currentCwd = msg.cwd || currentCwd; currentFile = msg.file; break;
        case 'newSession': startNewSession(); break;
        case 'resumeSessionAck': resumeSession(msg.sessionId); break;
        case 'sendMessageAck': doSend(msg.text, msg.sessionId || currentSessionId); break;
        case 'interruptAck': doInterrupt(msg.sessionId); break;
        case 'slashCommandAck': doSlash(msg.command, msg.sessionId); break;
        case 'sessionList': break;
        case 'profileList': break;
      }
    });

    function onServerReady() {
      console.log('[Hermes] Server ready, showing chat');
      showChat();
    }

    // ── WS Event handling (relayed from extension host) ──
    function handleWsEvent(data) {
      if (data.method === 'event') {
        const p = data.params || {};
        const t = p.type;
        if (!t) return;
        console.log('[Hermes] Event:', t);

        switch (t) {
          case 'gateway.ready':
            showChat();
            break;
          case 'session.info': break;
          case 'session.title':
            if (p.payload?.title) document.title = 'Hermes: ' + p.payload.title;
            break;
          case 'message.start':
            startAssistant();
            break;
          case 'thinking.delta':
            appendThinking(p.payload?.text || p.text || '');
            break;
          case 'reasoning.available':
            setReasoning(p.payload?.text || p.text || '');
            break;
          case 'message.delta':
          case 'message.complete':
            appendAssistant(p.payload?.text || p.text || '');
            break;
          case 'tool.start':
          case 'tool.call':
            addToolCall(p.payload || p);
            break;
          case 'tool.delta':
            updateToolCall(p.payload || p);
            break;
          case 'tool.end':
          case 'tool.result':
            finishToolCall(p.payload || p);
            break;
          case 'status.update':
            addStatus(p.payload?.text || p.text || '');
            break;
          case 'turn.end':
            finishTurn();
            break;
          case 'error':
            addError(p.payload?.message || p.message || 'Unknown error');
            break;
        }
        return;
      }
      // RPC response forwarded from host
      if (data.id && data.result) {
        if (data.result.session_id) {
          currentSessionId = data.result.session_id;
        }
      }
    }

    // ── RPC via extension host relay ──
    function sendRpc(method, params) {
      const id = ++rpcCounter;
      vscode.postMessage({ type: 'wsSendRpc', id, method, params });
    }

    // ── UI Helpers ──
    function showConnecting(show, error) {
      const el = document.getElementById('connecting');
      if (show) { el.style.display = 'block'; }
      else if (error) {
        el.innerHTML = '<div style="color:var(--error)">' + error + '</div>';
        el.style.display = 'block';
      } else { el.style.display = 'none'; }
    }

    function showChat() {
      showConnecting(false);
      document.getElementById('context-bar').style.display = 'flex';
      document.getElementById('input-area').style.display = 'flex';
      document.getElementById('user-input').focus();
      vscode.postMessage({ type: 'createSession', cwd: currentCwd });
    }

    function updateContext(file, cwd) {
      currentFile = file;
      currentCwd = cwd || currentCwd;
      const el = document.getElementById('ctx-file');
      if (file) {
        const name = file.split('/').pop();
        el.textContent = '📄 ' + name;
        el.title = file;
      } else {
        el.textContent = cwd ? '📁 ' + cwd.split('/').pop() : '';
      }
    }

    // ── Session management ──
    function startNewSession() {
      currentSessionId = null;
      document.getElementById('messages').innerHTML = '';
      sendRpc('session.create', { cols: 120, source: 'vscode', cwd: currentCwd });
    }

    function resumeSession(sid) {
      sendRpc('session.resume', { session_id: sid });
      currentSessionId = sid;
      document.getElementById('messages').innerHTML = '';
    }

    // ── Message rendering ──
    function addUserMessage(text) {
      const div = document.createElement('div');
      div.className = 'msg user';
      div.textContent = text;
      document.getElementById('messages').appendChild(div);
      scrollDown();
    }

    function startAssistant() {
      isStreaming = true;
      setButtons(true);
      assistantText = '';
      thinkingText = '';
      const div = document.createElement('div');
      div.className = 'msg assistant';
      div.innerHTML = '<div class="role">Assistant</div><span class="content"></span>';
      document.getElementById('messages').appendChild(div);
      assistantEl = div.querySelector('.content');
      const t = document.createElement('div');
      t.className = 'thinking';
      t.innerHTML = '<div class="header" onclick="this.parentElement.classList.toggle(\'open\')">Thinking...</div><div class="content"></div>';
      t.style.display = 'none';
      document.getElementById('messages').appendChild(t);
      thinkingEl = t;
      scrollDown();
    }

    function appendThinking(text) {
      if (!text || !thinkingEl) return;
      thinkingEl.style.display = 'block';
      thinkingText += text;
      thinkingEl.querySelector('.content').textContent = thinkingText;
      scrollDown();
    }

    function setReasoning(text) {
      if (!text || !thinkingEl) return;
      thinkingEl.style.display = 'block';
      thinkingText = text;
      thinkingEl.querySelector('.content').textContent = text;
    }

    function appendAssistant(text) {
      if (!text || !assistantEl) return;
      assistantText += text;
      assistantEl.innerHTML = renderMarkdown(assistantText);
      scrollDown();
    }

    function addToolCall(p) {
      const div = document.createElement('div');
      div.className = 'tool-call';
      div.dataset.toolId = p.tool_id || p.id || '';
      const name = p.tool || p.name || 'tool';
      const args = p.args || p.arguments || '';
      div.innerHTML = '<span class="tool-name" onclick="this.parentElement.classList.toggle(\'expanded\')">' +
        name + '</span><div class="tool-detail">' + (typeof args === 'string' ? args : JSON.stringify(args, null, 2)) + '</div>';
      document.getElementById('messages').appendChild(div);
      scrollDown();
    }

    function updateToolCall(p) {
      const id = p.tool_id || p.id || '';
      const el = document.querySelector('.tool-call[data-tool-id="' + id + '"]');
      if (!el) return;
      const detail = el.querySelector('.tool-detail');
      if (detail && p.delta) detail.textContent += p.delta;
    }

    function finishToolCall(p) {
      const id = p.tool_id || p.id || '';
      const el = document.querySelector('.tool-call[data-tool-id="' + id + '"]');
      if (!el) return;
      el.style.borderLeftColor = p.error ? 'var(--error)' : 'var(--success)';
      const detail = el.querySelector('.tool-detail');
      if (detail && p.result) {
        detail.textContent += '\n--- Result ---\n' + (typeof p.result === 'string' ? p.result : JSON.stringify(p.result, null, 2));
      }
    }

    function addStatus(text) {
      if (!text) return;
      const div = document.createElement('div');
      div.className = 'status-line';
      div.textContent = text;
      document.getElementById('messages').appendChild(div);
      scrollDown();
    }

    function addError(text) {
      const div = document.createElement('div');
      div.className = 'error-msg';
      div.textContent = '⚠ ' + text;
      document.getElementById('messages').appendChild(div);
      scrollDown();
    }

    function finishTurn() {
      isStreaming = false;
      setButtons(false);
      if (thinkingEl && !thinkingText) thinkingEl.style.display = 'none';
      assistantEl = null;
      thinkingEl = null;
    }

    // ── Send / interrupt ──
    function sendMessage() {
      const ta = document.getElementById('user-input');
      const text = ta.value.trim();
      if (!text) return;
      ta.value = '';
      ta.style.height = 'auto';
      addUserMessage(text);
      if (!currentSessionId) {
        sendRpc('session.create', { cols: 120, source: 'vscode', cwd: currentCwd });
        // Wait a moment for session to be created, then send
        // The session.create result will set currentSessionId, but since RPC
        // is async through the relay, we also send via doSend which checks
        setTimeout(() => { doSend(text, currentSessionId); }, 500);
        return;
      }
      doSend(text, currentSessionId);
    }

    function doSend(text, sid) {
      if (!sid) {
        addError('No session yet — create one first');
        return;
      }
      vscode.postMessage({ type: 'sendMessage', text, sessionId: sid });
      sendRpc('prompt.submit', { session_id: sid, text });
    }

    function doInterrupt(sid) {
      sendRpc('session.interrupt', { session_id: sid });
    }

    function doSlash(command, sid) {
      sendRpc('slash.exec', { session_id: sid, command });
    }

    // ── Input handling ──
    document.getElementById('user-input').addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });
    document.getElementById('user-input').addEventListener('input', (e) => {
      const ta = e.target;
      ta.style.height = 'auto';
      ta.style.height = Math.min(ta.scrollHeight, 200) + 'px';
    });

    function setButtons(streaming) {
      const btn = document.getElementById('send-btn');
      if (streaming) {
        btn.textContent = 'Stop';
        btn.onclick = () => { doInterrupt(currentSessionId); };
      } else {
        btn.textContent = 'Send';
        btn.onclick = sendMessage;
      }
    }

    function scrollDown() {
      const el = document.getElementById('messages');
      el.scrollTop = el.scrollHeight;
    }

    // ── Markdown-lite ──
    function renderMarkdown(text) {
      if (!text) return '';
      let html = text
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/```(\w*)\n?([\s\S]*?)```/g, (m, lang, code) => {
          return '<pre style="background:#0d1117;padding:8px;border-radius:4px;overflow-x:auto;margin:4px 0;font-size:12px;"><code>' + code.trim() + '</code></pre>';
        })
        .replace(/`([^`]+)`/g, '<code style="background:#333;padding:1px 4px;border-radius:3px;font-size:12px;">$1</code>')
        .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
        .replace(/(^|\s)(\/[^\s]+\.[a-z]{2,})/g, (m, pre, p) => {
          return pre + '<span class="file-link" onclick="openFile(\'' + p + '\')">' + p + '</span>';
        })
        .replace(/\n/g, '<br>');
      return html;
    }

    function openFile(p) {
      vscode.postMessage({ type: 'openFile', path: p });
    }
  </script>
</body>
</html>
